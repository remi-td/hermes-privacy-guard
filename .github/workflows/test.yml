name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Run guard unit tests
        run: python -m pytest -q tests/test_guard.py
      - name: Clone Hermes for dispatch integration
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
      - name: Install Hermes runtime dependencies
        run: python -m pip install --disable-pip-version-check -e /tmp/hermes-agent
      - name: Prove sensitive delegation is blocked before child dispatch
        env:
          HERMES_SOURCE: /tmp/hermes-agent
        run: python -m pytest -q tests/test_hermes_integration.py
